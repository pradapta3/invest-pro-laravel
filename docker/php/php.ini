; Loaded as conf.d/zz-app.ini — the zz- prefix keeps it last, so these values
; win over anything the base image or an extension dropped in earlier.

; Headroom for the backtest, which is the only page that comes near it. With
; the default capped universe it peaks around 150MB; against the whole exchange
; (BACKTEST_UNIVERSE=0) a walk-forward run measured 472MB, which does not fit
; in the old 512M with any margin and fatals into a bare 500. Ordinary requests
; sit near 30MB.
memory_limit = 768M

; Kept under nginx's fastcgi_read_timeout (120s) so a request that has to be cut
; off is cut off by PHP, with a logged error, rather than by the web server with
; nothing to show for it. Note the real ceiling is further out still: an edge
; proxy in front of this stack has its own timeout — nginx-proxy defaults to
; 60s — and that one fires first.
max_execution_time = 110
max_input_time = 120
post_max_size = 20M
upload_max_filesize = 20M

expose_php = Off
date.timezone = Asia/Jakarta

; php-fpm writes to the container's stderr, which is what `docker compose logs`
; reads. display_errors stays off so a stack trace never reaches a browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- OPcache ----------------------------------------------------------------
; validate_timestamps=0 is safe (and a large win) precisely because the code is
; baked into an immutable image: the only way the files change is a new image,
; which means a new container and therefore a cold cache anyway.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
