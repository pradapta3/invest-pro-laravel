; Loaded as conf.d/zz-app.ini — the zz- prefix keeps it last, so these values
; win over anything the base image or an extension dropped in earlier.

; 512M was not enough for one legitimate page. A walk-forward backtest runs the
; engine once per yearly period plus once over the whole range and holds every
; result at the same time; measured against the full IDX universe with two years
; of history it peaked at 472MB, which fatals on a bad day and returns a bare
; 500. Ordinary requests sit near 30MB, so this headroom is only ever claimed by
; the backtest page.
memory_limit = 768M

; The same run took 81 seconds. Kept under nginx's fastcgi_read_timeout (120s)
; so a request that is going to be cut off is cut off by PHP, with a logged
; error, rather than by the web server with nothing to show for it.
max_execution_time = 110
max_input_time = 120
post_max_size = 20M
upload_max_filesize = 20M

expose_php = Off
date.timezone = Asia/Jakarta

; php-fpm writes to the container's stderr, which is what `docker compose logs`
; reads. display_errors stays off so a stack trace never reaches a browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- OPcache ----------------------------------------------------------------
; validate_timestamps=0 is safe (and a large win) precisely because the code is
; baked into an immutable image: the only way the files change is a new image,
; which means a new container and therefore a cold cache anyway.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
