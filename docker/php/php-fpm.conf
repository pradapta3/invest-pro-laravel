; Overrides for the base image's [www] pool.

[www]
user = www-data
group = www-data

; nginx runs in the same container, so a loopback socket is all that is needed
; and nothing outside the container can reach php-fpm.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; The app is configured entirely through the bind-mounted .env file, but
; clear_env = no also lets docker-compose `environment:` entries (CONTAINER_ROLE,
; TZ, ...) reach PHP, which is what the entrypoint relies on.
clear_env = no

; Send worker output to the container log instead of swallowing it.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Kill any request that outlives nginx's fastcgi_read_timeout, so a hung
; upstream fetch (Yahoo Finance, TradingView, Gemini) cannot pin a worker
; forever.
request_terminate_timeout = 130s
