; Used only by the CONTAINER_ROLE=app container, to run nginx and php-fpm side
; by side. The queue and scheduler containers exec their artisan command
; directly (single process, no supervisor), so Docker's own restart policy is
; what keeps them alive.

[supervisord]
nodaemon = true
user     = root
pidfile  = /run/supervisord.pid
logfile  = /dev/null
logfile_maxbytes = 0
loglevel = info

[program:php-fpm]
command  = php-fpm --nodaemonize --force-stderr
priority = 5
autostart = true
autorestart = true
startretries = 5
stopsignal = QUIT
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command  = nginx -g "daemon off;"
priority = 10
autostart = true
autorestart = true
startretries = 5
; QUIT lets nginx finish in-flight requests instead of dropping them.
stopsignal = QUIT
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
