# Complete nginx config (not a site snippet) — it replaces /etc/nginx/nginx.conf
# wholesale so the Alpine package defaults, including its own listen-on-80
# server block, never apply.

user                www-data;
worker_processes    auto;
pid                 /run/nginx/nginx.pid;
error_log           /dev/stderr notice;

# Docker gives a container a 1024 soft file-descriptor limit against a much
# larger hard limit, and each connection costs a descriptor. Without this,
# worker_connections below is silently capped at that 1024 and nginx logs
# "worker_connections exceed open file resource limit" on every start.
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # $remote_addr is the reverse proxy, so the visitor's address is carried in
    # xff= — see the note on realip in the server block below for why nginx
    # does not resolve that itself.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'xff="$http_x_forwarded_for" rt=$request_time';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 20m;

    # No gzip here on purpose: Caddy is the only thing that talks to this
    # server and it already compresses on the way out to the browser.
    gzip off;

    server {
        listen      8080 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        # Deliberately no set_real_ip_from / real_ip_header here.
        #
        # The realip module rewrites $remote_addr to the client address it
        # reads out of X-Forwarded-For, and that address is what reaches PHP as
        # REMOTE_ADDR. Laravel's TrustProxies then compares REMOTE_ADDR against
        # TRUSTED_PROXIES to decide whether to believe the X-Forwarded-*
        # headers — so rewriting it to a public client IP makes the request
        # look like it arrived straight off the internet, the proxy headers get
        # discarded, and url()/asset() emit http:// links on an https:// page.
        # Browsers then block every stylesheet and script as mixed content.
        #
        # Only one component may unwrap that header, and it has to be Laravel:
        # it is the one that needs the result. nginx keeps the forwarded chain
        # visible through xff= in the access log format instead.

        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite writes content-hashed filenames into public/build, so those are
        # safe to pin forever. Anything missing must 404 rather than fall
        # through to Laravel and render an HTML error page as a .js file.
        # nginx's add_header does not merge with an inherited one: declaring any
        # add_header in a location drops every header set at server level. Both
        # blocks below add Cache-Control, so each has to restate nosniff — it
        # matters most for /storage/, which serves user-supplied files.
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        location ^~ /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;

            # $realpath_root rather than $document_root so OPcache keys entries
            # by the resolved path — otherwise a symlinked release directory
            # gets a duplicate cache entry per deploy.
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;

            # Deliberately no `fastcgi_param HTTPS` here. Setting it from
            # X-Forwarded-Proto would make Laravel treat the request as secure
            # no matter who sent the header, quietly bypassing the TRUSTED_PROXIES
            # check in bootstrap/app.php. Leaving it out keeps proxy trust in one
            # place, so a misconfigured TRUSTED_PROXIES fails visibly (http:// links
            # on an https:// site) instead of being masked here.
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size  32k;
            fastcgi_buffers      16 16k;
        }

        # Dotfiles stay private, except the ACME challenge path.
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
