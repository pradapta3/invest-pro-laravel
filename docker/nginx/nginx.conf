# Complete nginx config (not a site snippet) — it replaces /etc/nginx/nginx.conf
# wholesale so the Alpine package defaults, including its own listen-on-80
# server block, never apply.

user                www-data;
worker_processes    auto;
pid                 /run/nginx/nginx.pid;
error_log           /dev/stderr notice;

events {
    worker_connections 2048;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 20m;

    # No gzip here on purpose: Caddy is the only thing that talks to this
    # server and it already compresses on the way out to the browser.
    gzip off;

    # PHP treats any non-empty $_SERVER['HTTPS'] other than "off" as "on", so
    # forwarding the raw header value would mark plain http requests secure.
    # Map it to on/off explicitly instead.
    map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https   on;
    }

    server {
        listen      8080 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        # Caddy is the only ingress and it sits on the container network, so
        # trust X-Forwarded-For from RFC1918 space to recover the real client
        # IP for the access log. Laravel does the equivalent via TrustProxies
        # (see bootstrap/app.php).
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header   X-Forwarded-For;
        real_ip_recursive on;

        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite writes content-hashed filenames into public/build, so those are
        # safe to pin forever. Anything missing must 404 rather than fall
        # through to Laravel and render an HTML error page as a .js file.
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location ^~ /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;

            # $realpath_root rather than $document_root so OPcache keys entries
            # by the resolved path — otherwise a symlinked release directory
            # gets a duplicate cache entry per deploy.
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_param HTTPS           $fastcgi_https if_not_empty;

            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size  32k;
            fastcgi_buffers      16 16k;
        }

        # Dotfiles stay private, except the ACME challenge path.
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
